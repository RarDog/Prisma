name: prisma_app
description: Local backend/core layer for a Flutter booru browser app.
publish_to: "none"
version: 4.2.1-rc.1+124

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.2
  flutter_staggered_grid_view: ^0.7.0
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_macos_video: ^1.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  file_selector: ^1.0.3
  path: ^1.9.0
  archive: ^3.6.1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  media_kit_libs_android_video: ^1.3.8
  share_plus: ^10.0.0
  dynamic_color: ^1.7.0
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  flutter_lints: ^3.0.2

dependency_overrides:
  isar_flutter_libs:
    path: third_party/isar_flutter_libs

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
